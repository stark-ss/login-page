<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
</head>
<body>
    <main>
    <form action="" method="post">
        <h1 > login page</h1>
        <!-- email-->
         <div id="email_input">
         <label for="accemail">email</label><br>
         <input type="email" 
         name="account_email" 
         autocomplete="email" 
         placeholder="email" 
         id="accemail"
         required ><br>
         </div>
         <!--password-->
         <div id="password_input">
         <label for="pass">password</label><br>
         <input type="password" 
         name="user_password" 
         placeholder="type the password" 
         id="pass"
         minlength="5"
         required>
         <button type="button">show</button><br>
         </div>
         <button type="submit"> submit </button><br>
         <!--other options-->
         <div id="oher_options">
         <a href="">forgot password</a> 
         <a href="">sign up</a>
         </div>
    </form>
 </main>
    
</body>
</html>
